name: Source-only development
run-name: dev ${{ inputs.task }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      snapshot_sha:
        description: Parentless source snapshot commit in this private repository
        required: true
        type: string
      task:
        required: true
        type: choice
        options: [fast, native, lab, resolve, updates, ios-lab-prepare, ios-lab, ios-keyboard, net-unit, net-node, net-vendor, net-wan-build, net-wan-lifetime, net-wan-peer, net-congestion, netlab-vz-probe, netlab-smoke, netlab-dynamic, netlab-compare, netlab-hop, netlab-recovery, netlab-stability, netlab-stalls, netlab-diagnostic, netlab-hop-diagnostic, netlab]
        default: fast
      executor:
        description: Standard lanes or the existing Mac worker for portable network checks
        type: choice
        options: [standard, mac]
        default: standard
      bundle_blob_sha:
        description: Optional exact Git blob for the Mac API source transport
        type: string
      bundle_sha256:
        description: SHA-256 of the optional Mac source bundle
        type: string
      wan_run_id:
        description: Optional owned WAN experiment ID, required for net-wan-peer
        type: string
      request_id:
        description: Client receipt ID
        required: true
        type: string

permissions:
  contents: read


jobs:
  network-mac:
    if: inputs.executor == 'mac' && inputs.task == 'net-node'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Validate exact source and task inputs
        env:
          SNAPSHOT_SHA: ${{ inputs.snapshot_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
          DEV_TASK: ${{ inputs.task }}
          BUNDLE_BLOB: ${{ inputs.bundle_blob_sha }}
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
          WAN_RUN_ID: ${{ inputs.wan_run_id }}
        run: |
          set -euo pipefail
          [[ "$SNAPSHOT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUEST_ID" =~ ^[0-9a-f]{32}$ ]]
          case "$DEV_TASK" in net-unit|net-node|net-vendor|net-wan-build|net-wan-lifetime|net-wan-peer|net-congestion|netlab-vz-probe) ;; *) exit 2 ;; esac
          if [[ "$DEV_TASK" == net-wan-peer ]]; then [[ "$WAN_RUN_ID" =~ ^[0-9a-f]{16}$ ]]; fi
          if [[ -n "$BUNDLE_BLOB$BUNDLE_SHA256" ]]; then
            [[ "$BUNDLE_BLOB" =~ ^[0-9a-f]{40}$ ]]
            [[ "$BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          fi
      - name: Select the release Xcode and record the hosted network environment
        env:
          REPORT_DIR: ${{ runner.temp }}/mac-network-evidence
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.5.app
          mkdir -p "$REPORT_DIR"
          python3 - <<'PYHOST'
          import json, os, platform, subprocess
          from pathlib import Path
          commands=[['sw_vers'],['xcodebuild','-version'],['/sbin/ifconfig','lo0'],['/usr/sbin/scutil','--nwi'],['/usr/sbin/netstat','-rn','-f','inet6']]
          rows=[]
          for command in commands:
              result=subprocess.run(command,capture_output=True,text=True,timeout=15)
              rows.append(dict(command=command,returncode=result.returncode,stdout=result.stdout,stderr=result.stderr))
          (Path(os.environ['REPORT_DIR'])/'host-capabilities.json').write_text(json.dumps(dict(system=platform.platform(),image=os.environ.get('ImageVersion'),commands=rows),indent=2)+'\n')
          PYHOST
      - name: Fetch trusted control and exact source through the GitHub API
        if: inputs.bundle_blob_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_SHA: ${{ inputs.snapshot_sha }}
          SOURCE_BUNDLE_BLOB_SHA: ${{ inputs.bundle_blob_sha }}
          SOURCE_BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
          SOURCE_PACKAGE: ${{ runner.temp }}/mac-network-package
          REPORT_DIR: ${{ runner.temp }}/mac-network-evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, runpy
          from pathlib import Path
          from urllib.request import Request, urlopen
          url = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/contents/scripts/bootstrap-network.py?ref=' + os.environ['GITHUB_SHA']
          request = Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urlopen(request, timeout=120) as response:
              raw = response.read(512 * 1024 + 1)
          if len(raw) > 512 * 1024:
              raise ValueError('control bootstrap exceeds size limit')
          data = json.loads(raw)
          if data['encoding'] != 'base64':
              raise ValueError('unexpected control bootstrap encoding')
          content = base64.b64decode(''.join(data['content'].split()), validate=True)
          digest = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
          if len(content) != data['size'] or digest != data['sha']:
              raise ValueError('control bootstrap blob identity mismatch')
          script = Path(os.environ['RUNNER_TEMP']) / 'bootstrap-network.py'
          script.write_bytes(content)
          runpy.run_path(str(script), run_name='__main__')
          PY
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Compare real aborted preconnections against resilient accept handling
        env:
          DEV_TASK: ${{ inputs.task }}
          REPORT_DIR: ${{ runner.temp }}/mac-network-evidence
          SOURCE_PACKAGE: ${{ runner.temp }}/mac-network-package
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL=/dev/null
          bash "$NETWORK_CONTROL_DIR/scripts/network.sh" 2>&1 | tee "$REPORT_DIR/task.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: dev-evidence
          path: ${{ runner.temp }}/mac-network-evidence
          if-no-files-found: error
          retention-days: 7