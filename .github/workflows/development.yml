name: Source-only public builder verification
run-name: Public builder tooling ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      snapshot_sha:
        required: true
        type: string
      task:
        required: true
        type: choice
        options: [fast]
      request_id:
        required: true
        type: string

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.snapshot_sha }}
          path: snapshot
          persist-credentials: false
      - name: Verify and materialize the exact source envelope
        env:
          SNAPSHOT_SHA: ${{ inputs.snapshot_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          [[ "$SNAPSHOT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUEST_ID" =~ ^[0-9a-f]{32}$ ]]
          python3 control/scripts/prepare-development.py snapshot "$RUNNER_TEMP/source-package"
          git clone --no-hardlinks "$RUNNER_TEMP/source-package/source.git" "$RUNNER_TEMP/portable-source"
          mkdir -p "$RUNNER_TEMP/public-builder-evidence"
          cp "$RUNNER_TEMP/source-package/source.json" "$RUNNER_TEMP/public-builder-evidence/source.json"
      - name: Verify public submission and existing private builder contracts
        working-directory: ${{ runner.temp }}/portable-source
        run: |
          set -euo pipefail
          for suite in test_public_builder.py test_remote_development.py test_developer_lab.py; do
            python3 -B -m unittest discover -s scripts/tests -p "$suite" -v 2>&1 | tee "$RUNNER_TEMP/public-builder-evidence/$suite.log"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: public-builder-evidence
          path: ${{ runner.temp }}/public-builder-evidence
          if-no-files-found: warn
          retention-days: 7
