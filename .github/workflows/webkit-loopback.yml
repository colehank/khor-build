name: Native WebKit loopback routing probe
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional public Khor revision to format without compiling
        type: string
        default: ''
permissions:
  contents: read
jobs:
  probe:
    if: ${{ inputs.source_sha == '' }}
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Measure native routing with isolated local endpoints
        env:
          REPORT_DIR: ${{ runner.temp }}/webkit-loopback-evidence
        run: python3 scripts/webkit-loopback.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: webkit-loopback-evidence
          path: ${{ runner.temp }}/webkit-loopback-evidence
          retention-days: 7
  format:
    if: ${{ inputs.source_sha != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Read and format exact public source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init source
          git -C source -c credential.helper= fetch --depth=1 https://github.com/colehank/khor.git "$SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          cd source
          rustfmt --edition 2024 --emit stdout apps/gui/core/src/web.rs > "$RUNNER_TEMP/formatted-web.rs"
          rustfmt --edition 2024 --emit stdout apps/gui/src-tauri/src/phone_page.rs > "$RUNNER_TEMP/formatted-phone_page.rs"
          rustfmt --edition 2024 --config skip_children=true --emit stdout apps/gui/src-tauri/src/lib.rs > "$RUNNER_TEMP/formatted-lib.rs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: formatted-borrow-source
          path: ${{ runner.temp }}/formatted-*.rs
          retention-days: 7
