name: Pinned browser regression
run-name: Browser ${{ inputs.task }} ${{ inputs.source_sha }}
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full public Khor source commit
        required: true
        type: string
      task:
        type: choice
        default: editor-overwrite
        options: [editor-overwrite, browser-yield, chat-recovery, scroll-lifecycle, terminal-links]
      frontend_run:
        type: string
        default: '42444612307'
      baseline_sha:
        type: string
        default: '20a8909377f9392d89336c0f549f5b73ce3eb186'
permissions:
  contents: read
  actions: read
jobs:
  editor-overwrite:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact public source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          BASELINE_SHA: ${{ inputs.baseline_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init source
          git -C source -c credential.helper= fetch --depth=1 https://github.com/colehank/khor.git "$SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git -C source -c credential.helper= fetch --depth=1 https://github.com/colehank/khor.git "$BASELINE_SHA"
          python3 - <<'PY'
          import os, subprocess
          changed = subprocess.check_output(['git', '-C', 'source', 'diff', '--name-only', os.environ['BASELINE_SHA'], os.environ['SOURCE_SHA']], text=True).splitlines()
          assert all(path.startswith(('apps/gui/src/', 'apps/gui/scripts/')) or path == 'apps/gui/package.json' for path in changed), changed
          PY
      - name: Reuse the source-matched public Quality frontend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          repository: colehank/khor
          run-id: ${{ inputs.frontend_run }}
          github-token: ${{ github.token }}
          name: frontend
          path: frontend
      - name: Verify and restore the same generated frontend inputs
        env:
          BASELINE_SHA: ${{ inputs.baseline_sha }}
          FRONTEND_RUN: ${{ inputs.frontend_run }}
        run: |
          python3 source/scripts/release_manifest.py verify --root frontend --sha "$BASELINE_SHA" --kind frontend --run-id "$FRONTEND_RUN"
          cp -R frontend/gen source/apps/gui/src/gen
          cp -R frontend/dist source/apps/gui/dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
      - run: npm ci
        working-directory: source/apps/gui
      - run: npx playwright-core install --with-deps chromium webkit
        working-directory: source/apps/gui
      - name: Repeat exact two-editor behavior without changing assertions
        if: ${{ inputs.task == 'editor-overwrite' }}
        working-directory: source/apps/gui
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: ''
          EDITOR_OVERWRITE_SCENARIOS: two-editors
          EDITOR_OVERWRITE_WEBKIT: '1'
        run: |
          failed=0
          for iteration in 1 2 3; do
            if EDITOR_OVERWRITE_CHECK_DIR="$RUNNER_TEMP/editor-overwrite-$iteration" npm run editor-overwrite; then
              echo "Iteration $iteration passed"
            else
              failed=1
            fi
          done
          exit "$failed"
      - name: Check production address handling and browser ownership
        if: ${{ inputs.task == 'browser-yield' }}
        working-directory: source/apps/gui
        env:
          KHOR_GATE_TMP: ${{ runner.temp }}/browser-address
        run: |
          mkdir -p "$KHOR_GATE_TMP"
          npx tsc --noEmit
          npx vite build
          npm run browser-yield
      - name: Repeat the exact directory recovery case in both engines
        if: ${{ inputs.task == 'chat-recovery' }}
        working-directory: source/apps/gui
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: ''
          CHAT_RECOVERY_SCENARIOS: directory-required-shell
          CHAT_RECOVERY_WEBKIT: '1'
        run: |
          failed=0
          for iteration in 1 2 3; do
            if CHAT_RECOVERY_CHECK_DIR="$RUNNER_TEMP/chat-recovery-$iteration" npm run chat-recovery; then
              echo "Iteration $iteration passed"
            else
              failed=1
            fi
          done
          exit "$failed"
      - name: Repeat the exact commit touch case in both engines
        if: ${{ inputs.task == 'scroll-lifecycle' }}
        working-directory: source/apps/gui
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: ''
          QUALITY_HEADLESS: '1'
          QUALITY_ENGINES: chrome,webkit
          QUALITY_ONLY: commit-touch
        run: |
          failed=0
          for iteration in 1 2 3; do
            if QUALITY_OUT="$RUNNER_TEMP/scroll-replay-$iteration" npm run scroll-lifecycle; then
              echo "Iteration $iteration passed"
            else
              failed=1
            fi
          done
          exit "$failed"
      - name: Check terminal links against real renderer redraws
        if: ${{ inputs.task == 'terminal-links' }}
        working-directory: source/apps/gui
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: ''
          TERMINAL_LINK_UI_DIR: ${{ runner.temp }}/terminal-links
        run: |
          npx tsc --noEmit
          npm run links
          npm run terminal-link-intent
          npm run terminal-links-ui
          TERMINAL_LINK_ENGINE=webkit TERMINAL_LINK_UI_DIR="$RUNNER_TEMP/terminal-links/webkit" npm run terminal-links-ui
          npm run terminal-links-app
      - name: Record runner memory and kernel process failures
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/runner-health"
          free -h > "$RUNNER_TEMP/runner-health/memory.txt"
          df -h > "$RUNNER_TEMP/runner-health/disk.txt"
          sudo dmesg | tail -150 > "$RUNNER_TEMP/runner-health/kernel-tail.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: editor-overwrite-evidence
          path: |
            ${{ runner.temp }}/editor-overwrite-*
            ${{ runner.temp }}/runner-health
            ${{ runner.temp }}/browser-address
            ${{ runner.temp }}/chat-recovery-*
            ${{ runner.temp }}/scroll-replay-*
            ${{ runner.temp }}/terminal-links
          if-no-files-found: warn
          retention-days: 7
