name: Source-only development
run-name: dev ${{ inputs.task }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      snapshot_sha:
        description: Parentless source snapshot commit in this private repository
        required: true
        type: string
      task:
        required: true
        type: choice
        options: [fast, native, lab, resolve, updates, ios-lab-prepare, ios-lab, ios-keyboard, net-unit, net-node, net-vendor, net-wan-build, net-wan-lifetime, net-wan-peer, net-congestion, netlab-vz-probe, netlab-smoke, netlab-dynamic, netlab-compare, netlab-hop, netlab-recovery, netlab-stability, netlab-stalls, netlab-diagnostic, netlab-hop-diagnostic, netlab]
        default: fast
      executor:
        description: Standard lanes or the existing Mac worker for portable network checks
        type: choice
        options: [standard, mac]
        default: standard
      bundle_blob_sha:
        description: Optional exact Git blob for the Mac API source transport
        type: string
      bundle_sha256:
        description: SHA-256 of the optional Mac source bundle
        type: string
      wan_run_id:
        description: Optional owned WAN experiment ID, required for net-wan-peer
        type: string
      request_id:
        description: Client receipt ID
        required: true
        type: string

permissions:
  contents: read



jobs:
  capture-cleanup:
    runs-on: macos-26
    timeout-minutes: 3
    steps:
      - name: Reproduce exact background capture cleanup without product tests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/capture-cleanup"
          sudo tcpdump -i lo0 -n -U -s 256 -c 2000 -w "$RUNNER_TEMP/capture-cleanup/empty.pcap" 'tcp and port 65534' > "$RUNNER_TEMP/capture-cleanup/capture.log" 2>&1 &
          capture_pid=$!
          sleep 1
          ps -p "$capture_pid" -o pid,ppid,comm | tee "$RUNNER_TEMP/capture-cleanup/process.log"
          sudo kill -INT "$capture_pid" 2>/dev/null || true
          for index in 1 2 3; do
            sleep 1
            if ! kill -0 "$capture_pid" 2>/dev/null; then break; fi
          done
          if kill -0 "$capture_pid" 2>/dev/null; then
            echo 'original_INT_cleanup_exited=false' | tee "$RUNNER_TEMP/capture-cleanup/result.txt"
            children=$(pgrep -P "$capture_pid" || true)
            if [[ -n "$children" ]]; then
              while IFS= read -r child; do sudo kill -TERM "$child" 2>/dev/null || true; done <<< "$children"
            fi
            sudo kill -TERM "$capture_pid" 2>/dev/null || true
            sleep 1
            sudo kill -KILL "$capture_pid" 2>/dev/null || true
          else
            echo 'original_INT_cleanup_exited=true' | tee "$RUNNER_TEMP/capture-cleanup/result.txt"
          fi
          wait "$capture_pid" 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: capture-cleanup-control
          path: ${{ runner.temp }}/capture-cleanup
          retention-days: 7
          if-no-files-found: error
