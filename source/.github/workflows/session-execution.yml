name: Session execution

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'

jobs:
  native-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: ./.github/actions/restore-frontend
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: session-execution
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check task workers, interactive MCP terminals and native session recognition
        run: python scripts/session_execution_checks.py
        env:
          SESSION_EXECUTION_EVIDENCE: ${{ runner.temp }}/session-execution
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: session-execution-${{ matrix.os }}
          path: ${{ runner.temp }}/session-execution
          retention-days: 7
