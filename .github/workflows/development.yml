name: Source-only development
run-name: infra retry probe (expected initial failure) ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: infra-retry-probe-${{ inputs.request_id }}
  cancel-in-progress: false
jobs:
  retained:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - run: printf 'immutable retained fixture\n' > retained.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: retained-probe
          path: retained.txt
          retention-days: 1
  fails-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Expected first-attempt failure; second attempt succeeds
        run: test "$GITHUB_RUN_ATTEMPT" -gt 1
  interrupted:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Await normal cancellation on first attempt
        run: |
          if [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]; then sleep 240; fi
