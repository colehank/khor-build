name: Native WebKit loopback routing probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Measure native routing with isolated local endpoints
        env:
          REPORT_DIR: ${{ runner.temp }}/webkit-loopback-evidence
        run: python3 scripts/webkit-loopback.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: webkit-loopback-evidence
          path: ${{ runner.temp }}/webkit-loopback-evidence
          retention-days: 7
