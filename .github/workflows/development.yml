name: Source-only development
run-name: dev ${{ inputs.task }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      snapshot_sha:
        description: Parentless source snapshot commit in this private repository
        required: true
        type: string
      task:
        required: true
        type: choice
        options: [fast, native, lab, resolve, updates, ios-lab-prepare, ios-lab, ios-keyboard, net-unit, net-node, net-vendor, net-wan-build, net-wan-lifetime, net-wan-peer, net-congestion, netlab-vz-probe, netlab-smoke, netlab-dynamic, netlab-compare, netlab-hop, netlab-recovery, netlab-stability, netlab-stalls, netlab-diagnostic, netlab-hop-diagnostic, netlab]
        default: fast
      executor:
        description: Standard lanes or the existing Mac worker for portable network checks
        type: choice
        options: [standard, mac]
        default: standard
      bundle_blob_sha:
        description: Optional exact Git blob for the Mac API source transport
        type: string
      bundle_sha256:
        description: SHA-256 of the optional Mac source bundle
        type: string
      wan_run_id:
        description: Optional owned WAN experiment ID, required for net-wan-peer
        type: string
      request_id:
        description: Client receipt ID
        required: true
        type: string

permissions:
  contents: read




jobs:
  native-error-fixture:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Exercise exact candidate native NSError callback for IPv4 and IPv6
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.5.app
          python3 - <<'NATIVE_ERROR'
          import base64,hashlib,json,os,socket,subprocess
          from pathlib import Path
          R=Path(os.environ['RUNNER_TEMP'])/'fixture-error-evidence';R.mkdir()
          source=base64.b64decode('')
          assert hashlib.sha256(source).hexdigest()=='9902bc9974d57c64a5760e896280d7d843a19dc70d9d0a754162d0e10f3408f8'
          fixture=R/'webkit_loopback.swift';fixture.write_bytes(source);program=Path(os.environ['RUNNER_TEMP'])/'webkit-loopback'
          meta=dict(source_commit='43df97304d1cbf8c725fd9769c528595e8fab413',source_fixture_sha256='9902bc9974d57c64a5760e896280d7d843a19dc70d9d0a754162d0e10f3408f8',source_fixture_git_blob='0c3ebe569a0539535e4de7400bae268535792cb6',control=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],fixed_cases=['127.0.0.1','[::1]'],Rust_builds=0,product_changes=0,replacements=0,limits='Failure callback serialization only, not full native Rust gate or original cause')
          (R/'source.json').write_text(json.dumps(meta,indent=2)+'\n')
          build=subprocess.run(['xcrun','swiftc','-swift-version','5',str(fixture),'-o',str(program)],capture_output=True,text=True);(R/'swift-build.log').write_text(build.stdout+build.stderr);assert build.returncode==0
          rows=[]
          for index,host in enumerate(meta['fixed_cases'],1):
           family=socket.AF_INET6 if ':' in host else socket.AF_INET
           with socket.socket(family,socket.SOCK_STREAM) as reserved:
            reserved.bind(('::1' if family==socket.AF_INET6 else host,0));port=reserved.getsockname()[1]
            # Keep the port bound but not listening throughout the native call.
            row=dict(index=index,host=host,port=port)
            try:
             result=subprocess.run([str(program),'direct',f'http://{host}:{port}/','1'],capture_output=True,text=True,timeout=30)
             (R/f'case-{index}.stdout').write_text(result.stdout);(R/f'case-{index}.stderr').write_text(result.stderr);value=json.loads(result.stdout)
             passed=result.returncode==0 and value.get('mode')=='direct' and 'body' not in value and bool(value.get('error')) and bool(value.get('domain')) and type(value.get('code')) is int and value['code']!=0 and isinstance(value.get('underlying'),str)
             row.update(returncode=result.returncode,result=value,passed=passed)
            except Exception as error:row.update(error=repr(error),passed=False)
            rows.append(row);(R/'results.json').write_text(json.dumps(dict(source=meta,results=rows),indent=2)+'\n');print(json.dumps(row),flush=True)
          raise SystemExit(0 if len(rows)==2 and all(x['passed'] for x in rows) else 1)
          NATIVE_ERROR
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-error-fixture
          path: ${{ runner.temp }}/fixture-error-evidence
          retention-days: 7
          if-no-files-found: error
