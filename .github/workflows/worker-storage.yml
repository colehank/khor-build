name: Inspect builder storage
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inventory or reclaim inactive superseded test programs
        type: choice
        required: true
        default: inventory
        options: [inventory, prune-test-programs]
permissions:
  contents: read
concurrency:
  group: mac-mini-worker
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: storage-script
          path: scripts/worker-storage.py
          retention-days: 3
  storage:
    needs: prepare
    runs-on: [khor-mac-mini, khor-dev]
    permissions: {}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: storage-script
          path: ${{ runner.temp }}/storage-script
      - name: Inspect owned cache without building
        env:
          MODE: ${{ inputs.mode }}
          REPORT_DIR: ${{ runner.temp }}/storage-report
        run: /usr/bin/python3 "$RUNNER_TEMP/storage-script/worker-storage.py" "$MODE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: worker-storage-report
          path: ${{ runner.temp }}/storage-report
          retention-days: 7
