name: Format source-only Rust edits

on:
  workflow_dispatch:
    inputs:
      base:
        description: Full public Khor baseline commit
        required: true
        type: string
      patch:
        description: Gzip/base64 Rust patch; formatter only, no compilation
        required: true
        type: string

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: colehank/khor
          ref: ${{ inputs.base }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Apply bounded source data and format without compiling
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, io, json, os, re, subprocess
          from pathlib import Path
          inputs = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          assert re.fullmatch('[0-9a-f]{40}', inputs['base'])
          with gzip.GzipFile(fileobj=io.BytesIO(base64.b64decode(inputs['patch'], validate=True))) as archive:
              patch = archive.read(1024 * 1024 + 1)
          assert len(patch) <= 1024 * 1024
          subprocess.run(['git', 'apply', '--index', '--binary', '-'], input=patch, check=True)
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).split(b'\0')
          assert all(not name or name.endswith(b'.rs') for name in changed)
          subprocess.run(['python3', 'scripts/check-rust-format.py', '--write'], check=True)
          result = subprocess.check_output(['git', 'diff', '--binary', '--', '*.rs'])
          Path('rust-format.patch').write_bytes(result)
          print('Formatting-only patch bytes:', len(result))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rust-format
          path: rust-format.patch
          retention-days: 1
