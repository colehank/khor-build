name: Diagnose provenance fixture timestamps
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: colehank/khor
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Repeat the exact synthetic fixture and record filesystem clocks
        working-directory: source
        run: python3 ../control/scripts/provenance-probe.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: provenance-clock-probe
          path: source/provenance-clock.json
          if-no-files-found: error
          retention-days: 7
