name: Khor native development checks

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full Khor commit SHA to build and test
        required: true
        type: string

      check:
        description: Full acceptance or an isolated approval/close regression
        required: true
        default: full
        type: choice
        options: [dependencies, full, approval, close, contracts, files, borrow, release-preflight, ios-release-preflight, session-startup, pair, keeper, startup, ssh-evidence, ssh, update-lab, update-lab-interrupt, cli-update-lab]

permissions:
  contents: read

concurrency:
  group: mac-mini-worker
  cancel-in-progress: false

jobs:
  prepare-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Package the pinned public source and build driver
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CHECK: ${{ inputs.check }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          package_dir="$RUNNER_TEMP/source-package"
          mkdir -p "$package_dir"
          git init --bare "$package_dir/source.git"
          git -C "$package_dir/source.git" -c credential.helper= fetch --depth=1 https://github.com/colehank/khor.git "$SOURCE_SHA"
          git -C "$package_dir/source.git" update-ref refs/heads/source FETCH_HEAD
          git -C "$package_dir/source.git" symbolic-ref HEAD refs/heads/source
          test "$(git --git-dir="$package_dir/source.git" rev-parse HEAD)" = "$SOURCE_SHA"
          cp scripts/native.sh "$package_dir/native.sh"
          cp scripts/update-lab.py "$package_dir/update-lab.py"
          cp scripts/cli-update-lab.py "$package_dir/cli-update-lab.py"
          cp scripts/release-preflight.py "$package_dir/release-preflight.py"
          cp scripts/session-startup.py "$package_dir/session-startup.py"
          cp scripts/webkit-loopback.swift "$package_dir/webkit-loopback.swift"
          cp scripts/worker-storage.py "$package_dir/worker-storage.py"
          printf '%s\n' "$SOURCE_SHA" > "$package_dir/source-sha.txt"
          if [[ "$CHECK" = dependencies || "$CHECK" = files || "$CHECK" = borrow || "$CHECK" = release-preflight || "$CHECK" = ios-release-preflight ]]; then
            git -c credential.helper= clone --mirror https://github.com/Brendonovich/swift-rs "$package_dir/swift-rs.git"
            git --git-dir="$package_dir/swift-rs.git" update-ref refs/khor/source HEAD
            git --git-dir="$package_dir/swift-rs.git" rev-parse HEAD > "$package_dir/swift-rs-sha.txt"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pinned-source
          path: ${{ runner.temp }}/source-package
          retention-days: 7

  native:
    needs: prepare-source
    permissions: {}
    runs-on: [khor-mac-mini, khor-dev]
    timeout-minutes: 180
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pinned-source
          path: ${{ runner.temp }}/source-package
      - name: Build and test pinned public Khor source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CHECK: ${{ inputs.check }}
          SOURCE_PACKAGE: ${{ runner.temp }}/source-package
          REPORT_DIR: ${{ runner.temp }}/native-evidence
        run: |
          mkdir -p "$REPORT_DIR"
          REPORT_DIR="$REPORT_DIR/cache-maintenance" /usr/bin/python3 "$SOURCE_PACKAGE/worker-storage.py" ensure-budget
          /Users/z13/khor-builder/bin/run-build /bin/bash "$SOURCE_PACKAGE/native.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mac-native-evidence
          path: ${{ runner.temp }}/native-evidence
          if-no-files-found: warn
          retention-days: 7
