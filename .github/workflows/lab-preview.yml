name: Trusted static Lab preview
run-name: Lab preview ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      snapshot_sha:
        description: Parentless source snapshot in this private repository
        required: true
        type: string
      request_id:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate source identity
        env:
          SNAPSHOT_SHA: ${{ inputs.snapshot_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          [[ "$SNAPSHOT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUEST_ID" =~ ^[0-9a-f]{32}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.snapshot_sha }}
          path: snapshot
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: snapshot/source/apps/gui/package-lock.json
      - name: Reuse unchanged generated frontend contracts from the trusted release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/colehank/khor/actions/runs/42077223682 --jq .head_sha)" = 0f643908283d925efeae8dd850bdd5de29313ed6
          gh run download 42077223682 --repo colehank/khor --name frontend --dir "$RUNNER_TEMP/frontend"
          mkdir -p snapshot/source/apps/gui/src/gen
          cp -R "$RUNNER_TEMP/frontend/gen/." snapshot/source/apps/gui/src/gen/
      - name: Install frontend dependencies
        working-directory: snapshot/source/apps/gui
        run: npm ci
      - name: Check and build the real-component Lab
        working-directory: snapshot/source/apps/gui
        env:
          PREVIEW_DIR: ${{ runner.temp }}/preview
        run: |
          set -euo pipefail
          npx tsc --project lab/mobile-navigation.tsconfig.json
          npx vite build --config lab/mobile-navigation.vite.ts --outDir "$PREVIEW_DIR"
          git -C ../../.. log -1 --format=%B > "$PREVIEW_DIR/source.txt"
          printf '%s\n' 'Generated contracts: colehank/khor 42077223682 / 0f643908283d925efeae8dd850bdd5de29313ed6' >> "$PREVIEW_DIR/source.txt"
      - name: Exercise the bundled Lab in Chromium
        working-directory: snapshot/source/apps/gui
        env:
          PREVIEW_DIR: ${{ runner.temp }}/preview
        run: |
          npx playwright-core install chromium
          node lab/check-mobile-navigation.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mobile-navigation-preview
          path: ${{ runner.temp }}/preview
          if-no-files-found: warn
          retention-days: 7

  retire-snapshot:
    needs: preview
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Retire this request's snapshot branch
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ inputs.request_id }}
          SNAPSHOT_SHA: ${{ inputs.snapshot_sha }}
        run: |
          set -euo pipefail
          [[ "$REQUEST_ID" =~ ^[0-9a-f]{32}$ ]]
          [[ "$SNAPSHOT_SHA" =~ ^[0-9a-f]{40}$ ]]
          ref="heads/dev-snapshots/$REQUEST_ID"
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/$ref" --jq .object.sha) || exit 0
          test "$actual" = "$SNAPSHOT_SHA"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/$ref"
