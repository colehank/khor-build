name: Lab browser probe
on:
  workflow_dispatch:
    inputs:
      frontend_run:
        type: string
        required: true
        default: '42265264535'
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: colehank/khor
          ref: dd854849e514032a1c261614d96945cbb11a1dca
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: source/apps/gui/package-lock.json
      - name: Acquire existing trusted frontend
        env:
          GH_TOKEN: ${{ github.token }}
          FRONTEND_RUN: ${{ inputs.frontend_run }}
        run: gh run download "$FRONTEND_RUN" --repo colehank/khor-build --name developer-lab-frontend --dir "$RUNNER_TEMP/frontend"
      - name: Probe scroll behavior without rebuilding Rust or the frontend
        working-directory: source/apps/gui
        env:
          LAB_BUNDLE: ${{ runner.temp }}/frontend
          LAB_REPORT: ${{ runner.temp }}/probe
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium webkit
          cp ../../../control/diagnostics/probe-list-scroll.mjs dev/lab/probe-list-scroll.mjs
          node dev/lab/probe-list-scroll.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: list-scroll-probe
          path: ${{ runner.temp }}/probe
          if-no-files-found: warn
