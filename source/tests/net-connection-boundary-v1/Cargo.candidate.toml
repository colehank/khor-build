[package]
name = "khor-connection-boundary"
version = "0.0.0"
edition = "2024"
[workspace]
[features]
default = []
khor_policy = []
qlog = []
[lib]
path = "lib.rs"
[dependencies]
iroh = { path = "@IROH@" }
iroh-base = "=1.4.1"
iroh-relay = { version = "=1.4.1", default-features = false, features = ["server", "test-utils"] }
iroh-metrics = { version = "=1.0.2", default-features = false }
noq = { version = "=1.4.0", default-features = false, features = ["rustls"] }
n0-error = { version = "1.0.0", features = ["anyhow"] }
n0-future = "0.3"
patchbay = { version = "=0.7.0", features = ["iroh-metrics"] }
tokio = { version = "1.44.1", features = ["full"] }
tracing = "0.1"
n0-tracing-test = "0.3"
serde_json = "1"
rand = "0.10"
ctor = "1.0"
khor-net = { path = "@KHOR_NET@" }
[patch.crates-io]
iroh = { path = "@IROH@" }
noq-proto = { path = "@NOQ_PROTO@" }
iroh-mdns-address-lookup = { path = "@MDNS@" }
swarm-discovery = { path = "@SWARM@" }
